# Groups `gh release create --generate-notes` output by PR label (release.yml `release` job).
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - "release:skip"
  categories:
    - title: Breaking changes
      labels:
        - "release:major"
    - title: Features
      labels:
        - enhancement
        - "release:minor"
    - title: Fixes
      labels:
        - bug
    - title: Other changes
      labels:
        - "*"
