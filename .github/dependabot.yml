version: 2
updates:
  # Action bumps don't change the shipped binary, so they cut a skip release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - release:skip

  # Base-image bumps change the shipped image, so leave these unlabeled to cut a patch release.
  # A bump to oven/bun must come with the same version in .bun-version (CI checks they match), so
  # CI and the release binaries build with the image's Bun.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
